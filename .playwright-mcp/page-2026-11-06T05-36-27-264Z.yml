        - generic [ref=f6e33]: Studio Philosophy & Story
        - heading "We Build Technology That Lasts. Engineered with Precision." [level=1] [ref=f6e34]
        - paragraph [ref=f6e35]:
          - text: Projukti Labs is an independent technology studio founded by
          - strong [ref=f6e36]: Md Parvezul Islam
          - text: . We reject the generic agency model of bloated templates and unaccountable subcontracting in favor of deep engineering rigor, sub-second speeds, and transparent client partnerships.
      - generic [ref=f6e37]:
        - generic [ref=f6e38]:
          - generic [ref=f6e39]: Origin Story
          - heading "Bridging Local Potential with Global Engineering Standards" [level=2] [ref=f6e40]
          - paragraph [ref=f6e41]: In modern digital business, web applications and online storefronts are the direct drivers of revenue. Yet, too many businesses in Bangladesh and emerging markets suffer from fragile, slow-loading websites that crash during marketing campaigns and leak ad spend through unverified tracking pixels.
          - paragraph [ref=f6e42]: "Projukti Labs was created to deliver a higher standard: enterprise-grade software engineering tailored for commercial agility."
        - generic [ref=f6e43]:
          - generic [ref=f6e44]:
            - heading "Zero Bloat Architecture" [level=3] [ref=f6e48]
            - paragraph [ref=f6e50]: We build on modern edge runtimes (Next.js, Cloudflare Workers) and type-safe databases. No unnecessary plugins, no security patch nightmares, and no artificial slowdowns.
          - generic [ref=f6e51]:
            - heading "Verified Telemetry" [level=3] [ref=f6e55]
            - paragraph [ref=f6e57]: We believe in verified proof. From Meta Conversions API event deduplication to Core Web Vitals telemetry, our implementations are tested and verified before handover.
          - generic [ref=f6e58]:
            - heading "Dual Market Expertise" [level=3] [ref=f6e63]
            - paragraph [ref=f6e65]: We understand Bangladesh's unique commerce ecosystem (bKash, Nagad, courier APIs) while seamlessly delivering international-standard payment and compliance systems (Stripe, GDPR, WCAG).
          - generic [ref=f6e66]:
            - heading "Long-Term Retainer Care" [level=3] [ref=f6e73]
            - paragraph [ref=f6e75]: We stand behind our code. Our SLA-backed monthly maintenance retainers provide continuous monitoring, automated backups, and dedicated monthly development capacity.
      - generic [ref=f6e76]:
        - generic [ref=f6e77]:
          - generic [ref=f6e78]: Our Code of Conduct
          - heading "Engineering Values We Refuse to Compromise On" [level=2] [ref=f6e79]
        - generic [ref=f6e80]:
          - generic [ref=f6e81]:
            - text: "01"
            - heading "Truthful Engineering" [level=3] [ref=f6e82]
            - paragraph [ref=f6e83]: We never fabricate metrics, client testimonials, or fake discounts. If a technical approach has tradeoffs, we explain them clearly before you sign a contract.
          - generic [ref=f6e84]:
            - text: "02"
            - heading "Direct Accountability" [level=3] [ref=f6e85]
            - paragraph [ref=f6e86]: You communicate directly with software engineers who write the code and architect the database. No sales executives or confusing intermediate handoffs.
          - generic [ref=f6e87]:
            - text: "03"
            - heading "Total Code Ownership" [level=3] [ref=f6e88]
            - paragraph [ref=f6e89]: Upon project completion and milestone clearance, you own 100% of your source code, deployment scripts, database schemas, and documentation. Zero vendor lock-in.
      - generic [ref=f6e90]:
        - heading "Interested in Collaborating with Projukti Labs?" [level=2] [ref=f6e91]
